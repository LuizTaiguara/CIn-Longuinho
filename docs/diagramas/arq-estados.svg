<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620">
  <defs>
    <marker id="arrowSolid3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#231F20"/>
    </marker>
    <marker id="arrowGray3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5854"/>
    </marker>
    <marker id="arrowHollow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0.8 0.8 L 9.2 5 L 0.8 9.2 z" fill="#FFFFFF" stroke="#5E5854" stroke-width="1.5"/>
    </marker>
    <marker id="arrowRed3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DB1E2F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="620" fill="#FFFFFF"/>

  <text x="36" y="52" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700" fill="#231F20">Ciclo de vida do item</text>
  <rect x="36" y="66" width="140" height="4" fill="#DB1E2F"/>
  <text x="36" y="94" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#5E5854">Cada transição está rotulada com quem a dispara.</text>

  <!-- QUARENTENA (above, gray dashed) -->
  <rect x="268" y="128" width="248" height="78" rx="14" fill="#F4F2EF" stroke="#5E5854" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="392" y="165" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#5E5854">QUARENTENA</text>
  <text x="392" y="190" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">fora do catálogo público</text>

  <!-- initial state -->
  <circle cx="86" cy="330" r="18" fill="#231F20"/>
  <text x="86" y="382" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">e-mail</text>
  <text x="86" y="402" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">recebido</text>

  <!-- ABERTO -->
  <rect x="268" y="292" width="248" height="78" rx="14" fill="#FFFFFF" stroke="#231F20" stroke-width="2.5"/>
  <text x="392" y="338" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="700" fill="#231F20">ABERTO</text>

  <!-- REIVINDICADO -->
  <rect x="624" y="292" width="248" height="78" rx="14" fill="#FFFFFF" stroke="#231F20" stroke-width="2.5"/>
  <text x="748" y="338" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="700" fill="#231F20">REIVINDICADO</text>

  <!-- ENCERRADO (final: double border) -->
  <rect x="980" y="292" width="248" height="78" rx="14" fill="#FFFFFF" stroke="#1F6F4A" stroke-width="2.5"/>
  <rect x="987" y="299" width="234" height="64" rx="10" fill="#FFFFFF" stroke="#1F6F4A" stroke-width="2.5"/>
  <text x="1104" y="338" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="700" fill="#1F6F4A">ENCERRADO</text>

  <!-- initial -> ABERTO -->
  <path d="M 104 330 L 268 330" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid3)"/>
  <text x="186" y="314" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">confiante (worker)</text>
  <text x="186" y="296" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">classificação</text>

  <!-- initial -> QUARENTENA -->
  <path d="M 86 312 L 86 240 L 268 171" fill="none" stroke="#5E5854" stroke-width="2.5" marker-end="url(#arrowGray3)"/>
  <text x="36" y="196" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">classificação</text>
  <text x="36" y="216" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">incerta (worker)</text>

  <!-- QUARENTENA -> ABERTO (dashed, future) -->
  <path d="M 330 206 L 330 292" fill="none" stroke="#5E5854" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowHollow3)"/>
  <text x="314" y="238" text-anchor="end" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">revisão manual</text>
  <text x="314" y="258" text-anchor="end" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">(painel — COULD)</text>
  <text x="314" y="278" text-anchor="end" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-style="italic" fill="#5E5854">transição futura</text>

  <!-- ABERTO -> REIVINDICADO -->
  <path d="M 516 318 L 624 318" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid3)"/>
  <text x="570" y="288" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">conversa (worker)</text>
  <text x="570" y="270" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">reivindicação na</text>
  <text x="570" y="252" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">detecção de</text>

  <!-- REIVINDICADO -> ENCERRADO -->
  <path d="M 872 318 L 980 318" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid3)"/>
  <text x="926" y="288" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">do autor (token)</text>
  <text x="926" y="270" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">ou confirmação</text>
  <text x="926" y="252" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">detecção (worker)</text>

  <!-- ABERTO -> ENCERRADO (curve below) -->
  <path d="M 392 370 C 392 462, 1104 462, 1104 370" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid3)"/>
  <text x="748" y="452" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">confirmação do autor (token)</text>

  <!-- REIVINDICADO note -->
  <rect x="604" y="134" width="300" height="76" rx="8" fill="#FFFFFF" stroke="#DB1E2F" stroke-width="2"/>
  <text x="620" y="160" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#DB1E2F">permanece visível no catálogo,</text>
  <text x="620" y="180" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#DB1E2F">exibindo há quanto tempo está</text>
  <text x="620" y="200" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#DB1E2F">nesse estado</text>
  <path d="M 754 210 L 748 292" fill="none" stroke="#DB1E2F" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- RULE: no regression. Curved arrow back ENCERRADO -> ABERTO, with X -->
  <path d="M 1190 292 C 1210 230, 1090 222, 1060 240" fill="none" stroke="#DB1E2F" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowRed3)"/>
  <g stroke="#DB1E2F" stroke-width="5" stroke-linecap="round">
    <path d="M 1128 232 L 1158 262"/>
    <path d="M 1158 232 L 1128 262"/>
  </g>
  <text x="928" y="150" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#DB1E2F">O estado nunca retrocede</text>
  <text x="928" y="172" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">não há transição de volta</text>

  <!-- RULE: no expiry -->
  <rect x="36" y="498" width="616" height="48" rx="8" fill="#FFFFFF" stroke="#DB1E2F" stroke-width="2"/>
  <text x="54" y="528" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#DB1E2F">Não há expiração por tempo: item aberto permanece aberto.</text>

  <!-- Legend -->
  <line x1="36" y1="566" x2="1264" y2="566" stroke="#C3BDB6" stroke-width="2"/>
  <path d="M 36 588 L 86 588" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid3)"/>
  <text x="100" y="594" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">transição implementada</text>
  <path d="M 330 588 L 380 588" fill="none" stroke="#5E5854" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowHollow3)"/>
  <text x="394" y="594" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">transição futura (COULD)</text>
  <rect x="650" y="578" width="40" height="22" rx="5" fill="#FFFFFF" stroke="#1F6F4A" stroke-width="2.5"/>
  <rect x="655" y="583" width="30" height="12" rx="3" fill="#FFFFFF" stroke="#1F6F4A" stroke-width="2"/>
  <text x="704" y="594" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">estado final (borda dupla)</text>
  <g stroke="#DB1E2F" stroke-width="4" stroke-linecap="round">
    <path d="M 968 580 L 990 600"/>
    <path d="M 990 580 L 968 600"/>
  </g>
  <text x="1006" y="594" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">transição proibida por regra</text>
</svg>
