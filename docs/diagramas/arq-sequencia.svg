<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <defs>
    <marker id="arrowSolid4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#231F20"/>
    </marker>
    <marker id="arrowRed4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DB1E2F"/>
    </marker>
    <marker id="arrowOpen4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5E5854" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#FFFFFF"/>

  <text x="40" y="52" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700" fill="#231F20">Sequência: do anúncio ao encerramento</text>
  <rect x="40" y="66" width="150" height="4" fill="#DB1E2F"/>

  <!-- Lifelines: x = 150, 420, 690, 960, 1250 -->
  <!-- participant boxes -->
  <rect x="48" y="90" width="204" height="56" rx="8" fill="#F4F2EF" stroke="#231F20" stroke-width="2.5"/>
  <text x="150" y="114" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#231F20">Quem encontra</text>
  <text x="150" y="135" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">pessoa</text>

  <rect x="318" y="90" width="204" height="56" rx="8" fill="#FFFFFF" stroke="#C3BDB6" stroke-width="2.5"/>
  <text x="420" y="114" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#5E5854">Lista do CIn</text>
  <text x="420" y="135" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">sistema externo</text>

  <rect x="588" y="90" width="204" height="56" rx="8" fill="#F4F2EF" stroke="#231F20" stroke-width="2.5"/>
  <text x="690" y="114" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#231F20">Worker</text>
  <text x="690" y="135" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">processo agendado</text>

  <rect x="858" y="90" width="204" height="56" rx="8" fill="#DB1E2F" stroke="#AF0421" stroke-width="3"/>
  <text x="960" y="114" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Repositório</text>
  <text x="960" y="135" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#FFFFFF">fonte de verdade</text>

  <rect x="1148" y="90" width="204" height="56" rx="8" fill="#F4F2EF" stroke="#231F20" stroke-width="2.5"/>
  <text x="1250" y="114" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#231F20">Quem perdeu</text>
  <text x="1250" y="135" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">pessoa</text>

  <!-- lifelines -->
  <path d="M 150 146 L 150 756" fill="none" stroke="#C3BDB6" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M 420 146 L 420 756" fill="none" stroke="#C3BDB6" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M 690 146 L 690 756" fill="none" stroke="#C3BDB6" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M 960 146 L 960 756" fill="none" stroke="#C3BDB6" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M 1250 146 L 1250 756" fill="none" stroke="#C3BDB6" stroke-width="2.5" stroke-dasharray="8 7"/>

  <!-- activation bar on Worker: steps 3..7 -->
  <rect x="678" y="330" width="24" height="238" rx="3" fill="#F4F2EF" stroke="#231F20" stroke-width="2"/>

  <!-- 1 -->
  <path d="M 150 196 L 420 196" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <circle cx="116" cy="196" r="14" fill="#231F20"/>
  <text x="116" y="201" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="295" y="186" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">envia e-mail: achei um fone no Grad 3</text>

  <!-- 2 -->
  <path d="M 420 254 L 1250 254" fill="none" stroke="#5E5854" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowOpen4)"/>
  <circle cx="396" cy="254" r="14" fill="#5E5854"/>
  <text x="396" y="259" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="835" y="244" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#5E5854">distribui para a comunidade</text>

  <!-- 3 : Worker -> Lista -->
  <path d="M 678 348 L 420 348" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <circle cx="740" cy="348" r="14" fill="#231F20"/>
  <text x="740" y="353" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <text x="545" y="318" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">busca mensagens novas</text>
  <text x="545" y="338" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">(polling, 5 min)</text>

  <!-- 4 : Lista -> Worker (return) -->
  <path d="M 420 398 L 678 398" fill="none" stroke="#5E5854" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrowOpen4)"/>
  <circle cx="396" cy="398" r="14" fill="#5E5854"/>
  <text x="396" y="403" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
  <text x="549" y="388" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#5E5854">retorna a mensagem</text>

  <!-- 5 : self call -->
  <path d="M 702 432 L 790 432 L 790 470 L 702 470" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <circle cx="740" cy="432" r="14" fill="#231F20"/>
  <text x="740" y="437" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
  <text x="806" y="456" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">classifica e extrai</text>

  <!-- 6 : Worker -> Repositorio -->
  <path d="M 702 516 L 960 516" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <circle cx="652" cy="516" r="14" fill="#231F20"/>
  <text x="652" y="521" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">6</text>
  <text x="831" y="506" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">grava item (situação: aberto)</text>

  <!-- 7 : Worker -> Quem encontra -->
  <path d="M 678 560 L 150 560" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <circle cx="740" cy="560" r="14" fill="#231F20"/>
  <text x="740" y="565" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">7</text>
  <text x="414" y="550" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">envia aviso com o link do item</text>

  <!-- time gap marker -->
  <path d="M 40 604 L 1360 604" fill="none" stroke="#C3BDB6" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- 8 : Quem perdeu -> Repositorio (RED) -->
  <path d="M 1250 652 L 960 652" fill="none" stroke="#DB1E2F" stroke-width="3" marker-end="url(#arrowRed4)"/>
  <circle cx="1276" cy="652" r="14" fill="#DB1E2F"/>
  <text x="1276" y="657" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">8</text>
  <text x="1105" y="642" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#DB1E2F">consulta o catálogo</text>

  <!-- asymmetry note -->
  <rect x="300" y="620" width="560" height="78" rx="8" fill="#FFFFFF" stroke="#DB1E2F" stroke-width="2.5"/>
  <text x="320" y="648" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#DB1E2F">Pode ocorrer dias depois do passo 1.</text>
  <text x="320" y="670" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#5E5854">Assimetria temporal: o anúncio é efêmero na lista, a</text>
  <text x="320" y="690" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#5E5854">busca é tardia. É isso que o catálogo resolve.</text>
  <path d="M 860 652 L 940 652" fill="none" stroke="#DB1E2F" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 9 : Quem encontra -> Repositorio -->
  <path d="M 150 736 L 960 736" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <circle cx="116" cy="736" r="14" fill="#231F20"/>
  <text x="116" y="741" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">9</text>
  <text x="555" y="726" text-anchor="middle" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="16" fill="#231F20">entra com a conta do CIn e encerra</text>

  <!-- Legend -->
  <line x1="40" y1="768" x2="1360" y2="768" stroke="#C3BDB6" stroke-width="2"/>
  <path d="M 40 790 L 94 790" fill="none" stroke="#231F20" stroke-width="2.5" marker-end="url(#arrowSolid4)"/>
  <text x="108" y="796" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">mensagem síncrona</text>
  <path d="M 300 790 L 354 790" fill="none" stroke="#5E5854" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowOpen4)"/>
  <text x="368" y="796" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#5E5854">mensagem assíncrona / retorno</text>
  <rect x="664" y="780" width="14" height="20" rx="2" fill="#F4F2EF" stroke="#231F20" stroke-width="2"/>
  <text x="692" y="796" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#231F20">barra de ativação do worker (passos 3 a 7)</text>
  <path d="M 1050 790 L 1104 790" fill="none" stroke="#DB1E2F" stroke-width="3" marker-end="url(#arrowRed4)"/>
  <text x="1118" y="796" font-family="Mulish, Segoe UI, system-ui, sans-serif" font-size="15" fill="#DB1E2F">assimetria temporal</text>
</svg>
