# Sobe o PostgreSQL com um comando (SCRUM-70, F-02).
#
#   cp .env.example .env        # uma vez
#   docker compose up -d banco  # sobe o banco e aplica as migrações de shared/migrations/
#   docker compose down -v      # apaga o volume: na próxima subida as migrações rodam de novo
#
# As migrações só rodam na PRIMEIRA subida do volume (comportamento da imagem oficial).
# Depois disso, aplique uma migração nova com:
#   docker compose exec -T banco psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < shared/migrations/NNN_x.sql
#
# Os valores de ${...} vêm do .env (o compose lê o arquivo sozinho). Nenhum segredo fica aqui.

services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-longuinho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-longuinho}
      POSTGRES_DB: ${POSTGRES_DB:-longuinho}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - banco-dados:/var/lib/postgresql/data
      - ./shared/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-longuinho} -d ${POSTGRES_DB:-longuinho}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Worker de ingestão (SCRUM-50). Não sobe com `docker compose up`: roda um ciclo e sai.
  #   docker compose run --rm worker
  # Em produção, pelo cron: */5 * * * * cd /caminho && docker compose run --rm worker
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: [worker]
    env_file: .env
    environment:
      # Dentro da rede do compose, o banco atende pelo nome do serviço.
      DATABASE_URL: postgresql://${POSTGRES_USER:-longuinho}:${POSTGRES_PASSWORD:-longuinho}@banco:5432/${POSTGRES_DB:-longuinho}
    volumes:
      # Cache do modelo do GLiNER: baixa uma vez, sobrevive entre os ciclos do cron.
      - worker-modelos:/modelos
    depends_on:
      banco:
        condition: service_healthy
    command: ["python", "-m", "worker", "--uma-vez"]

volumes:
  banco-dados:
  worker-modelos:
