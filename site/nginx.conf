# nginx do site (SCRUM-55). Serve o build do Vite e repassa /api/ para a API.
# Assim o site e a API ficam na mesma origem, e o cookie de sessão vale para os dois.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Foto de até 5 MB (US-06) mais a folga do multipart.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # O nome `api` é resolvido a cada requisição pelo DNS do Docker. Com a API parada, o nginx
    # sobe do mesmo jeito: o catálogo mostra a mensagem de erro e /api responde 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Rotas do React Router (/itens/..., /login, /meus-anuncios, /cadastrar) caem no index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
